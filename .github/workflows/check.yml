name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        continue-on-error: true
        with:
          args: "check --output-format=github"

  kodi-addon-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # kodi-addon-checker resolves the add-on by its directory name.
          path: plugin.audio.subsonic
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install kodi-addon-checker
      - run: kodi-addon-checker --branch matrix plugin.audio.subsonic
